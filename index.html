<!DOCTYPE html>
<html lang="bn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tiffin Deliver</title>
    <meta name="description" content="Tiffin Deliver app style website landing page" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Baloo+Bhai+2:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="screen-wrap">
      <div class="app-shell">
        <header class="statusbar">
          <div></div>
        </header>

        <section class="topbar">
          <div class="brand-mini">
            <img class="brand-logo-image" src="image/app_logo.png" alt="Tiffin Delivery logo" />
          </div>

          <div class="lang-pill">ENGLISH</div>

          <div class="top-icons" aria-label="action buttons">
            <button class="circle-btn bell-btn" aria-label="notifications">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M15 17h5l-1.4-1.4A2 2 0 0 1 18 14.2V11a6 6 0 1 0-12 0v3.2a2 2 0 0 1-.6 1.4L4 17h5" />
                <path d="M10 20a2 2 0 0 0 4 0" />
              </svg>
            </button>
            <button class="circle-btn user-btn" aria-label="profile">
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 19a5 5 0 0 1 10 0" />
                <circle cx="12" cy="8" r="4" />
              </svg>
            </button>
          </div>
        </section>

        <section class="hero-card">
          <h1>স্বাস্থ্যকর ও নিরাপদ টিফিন<br />বক্স আপনার দরজায়</h1>
          <div class="delivery-illustration" aria-hidden="true">
            <img class="hero-tiffin-image" src="image/tiffinbox.png" alt="Tiffin carrier" />
          </div>

          <div class="hero-tabs">
            <button class="tab active"><span class="check">✓</span> নিরাপদ ডেলিভারি</button>
            <button class="tab"><span class="icon">◔</span> সঠিকতা ও তাজা</button>
            <button class="tab"><span class="icon">✦</span> পরিষ্কার ও স্বাস্থ্য</button>
          </div>

          <div class="dots">
            <span class="dot active"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
        </section>

        <section class="promo-banner">
          <div class="promo-text">আজকের স্ট্যাটাস</div>
          <div class="promo-text right"><span>নির্ধারিত নেই</span></div>
        </section>

        <section class="package-header">
          <h2>আমাদের প্যাকেজ</h2>
          <a href="#">সব দেখুন <span>›</span></a>
        </section>

        <section class="package-grid">
          <article class="package-card">
            <div class="package-illustration small">
              <img class="package-tiffin-image" src="image/tiffinbox.png" alt="30 tiffin box delivery package" />
            </div>
            <h3>৩০ টি টিফিন বক্স<br />ডেলিভারি</h3>
            <button>১৯৮০ টাকা</button>
          </article>

          <article class="package-card">
            <div class="package-illustration small">
              <img class="package-tiffin-image" src="image/tiffinbox.png" alt="360 tiffin box delivery package" />
            </div>
            <h3>৩৬০ টি টিফিন বক্স<br />ডেলিভারি</h3>
            <button>৬৫৫০ টাকা</button>
          </article>
        </section>

        <nav class="bottom-nav" aria-label="Main navigation">
          <button class="nav-item active">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4v-7H9v7H5a1 1 0 0 1-1-1z" />
            </svg>
            <span>হোম</span>
          </button>
          <button class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="11" cy="11" r="5.5" />
              <path d="M16 16l4 4" />
            </svg>
            <span>অর্ডার করুন</span>
          </button>
          <button class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 12.5V7.8A2.8 2.8 0 0 1 7.8 5h8.4A2.8 2.8 0 0 1 19 7.8v4.7" />
              <path d="M7 19h10a2 2 0 0 0 2-2v-2H5v2a2 2 0 0 0 2 2Z" />
              <path d="M9 10h6" />
            </svg>
            <span>আমার অর্ডার</span>
          </button>
          <button class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <path d="M5 17.5V6.5A1.5 1.5 0 0 1 6.5 5h11A1.5 1.5 0 0 1 19 6.5v11a1.5 1.5 0 0 1-1.5 1.5H6.5A1.5 1.5 0 0 1 5 17.5Z" />
              <path d="M8 9h8M8 13h8M8 17h5" />
            </svg>
            <span>যোগাযোগ</span>
          </button>
          <button class="nav-item">
            <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="12" cy="8" r="4" />
              <path d="M5 19a7 7 0 0 1 14 0" />
            </svg>
            <span>অ্যাকাউন্ট</span>
          </button>
        </nav>
      </div>
    </div>
  </body>
</html>
